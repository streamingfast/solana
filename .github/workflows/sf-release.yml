# StreamingFast Docker image build and push, started on the tag created by
# sf-publish-release.yml (`workflow_dispatch` on the tag, a tag created with the
# workflow token does not trigger `push`) or by a manually pushed `*-fh*` tag.
name: Docker Build and Push

on:
  push:
    tags:
      - "*-fh*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: streamingfast/solana

jobs:
  docker-build-push:
    # 16-core org runner: the `./cargo build --release` of the agave workspace is
    # the whole cost of this job and parallelises well, so cores buy wall clock
    # almost linearly until the serial link tail dominates.
    #
    # Guarded on the repository so forks, which cannot see the organization's
    # runner and would otherwise queue forever with no error, fall back to a
    # standard runner.
    runs-on: ${{ github.repository == 'streamingfast/solana' && 'sf-ubuntu-24.04-16core' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: extract_tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
